[project]
name = "ocr-eval"
version = "0.10.0"
description = "Evaluation framework for multilingual OCR models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.14.0",
    "datasets==5.0.1",
    "easyocr==1.7.2",
    "jiwer==4.0.0",
    "numpy==2.5.2",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "pydantic-evals==2.31.1",
    "qwen-vl-utils==0.0.14",
    "torch==2.13.0+cu126",
    "torchvision==0.28.0+cu126",
    "transformers==5.15.0",
]

[tool.uv]
package = false
required-version = ">=0.12.5"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
